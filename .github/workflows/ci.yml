name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q nbastats app tests
      - name: Check front-end JavaScript
        run: node --check app/static/app.js
      - name: Tests (API tests skip without a database)
        run: python -m unittest discover -s tests -v
      - name: Docker image builds (with a placeholder database, so CI spends no LFS bandwidth)
        run: |
          python -c "import sqlite3,gzip,shutil; sqlite3.connect('/tmp/p.db').execute('create table t(x)').connection.commit(); shutil.copyfileobj(open('/tmp/p.db','rb'), gzip.open('data/nba_serve.db.gz','wb'))"
          docker build -t hoopslab:ci .
