# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The database ships in the repo as data/nba_serve.db.gz via Git LFS; Render pulls LFS files
# when it clones, and the Docker build unpacks and verifies it.
services:
  - type: web
    name: hoopslab
    runtime: docker
    # free: 512 MB RAM, sleeps after 15 idle minutes (first visit then takes ~1 min).
    # starter ($7/mo) stays awake; raise WEB_WORKERS to 2 there.
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: WEB_WORKERS
        value: "1"
      - key: NBA_API_CACHE_SECONDS
        value: "600"
