# Fly.io: `fly launch --no-deploy` (keep this file), then `fly deploy`.
app = "hoopslab"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8050"
  WEB_WORKERS = "2"

[http_service]
  internal_port = 8050
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
